name: Publish Docker image

# Remplace publish-images.ps1 : un push de tag `vX.Y.Z` build l'image et la
# publie sur ghcr.io avec les tags latest, vX.Y.Z et vX.Y.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Le lancement manuel (Actions > Run workflow) publie un tag `manual-<sha>`
# sans toucher à `latest`, pour tester le build.
#
# Un push sur une branche de test listée ci-dessous publie automatiquement
# l'image avec le nom de la branche comme tag (ex. `:FyTrOz`), sans toucher
# à `latest`. Sur le serveur de test : `docker compose pull && docker compose up -d`.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - FyTrOz
    # Ignoré pour les tags : seule une modification de l'app déclenche un build de branche
    paths:
      - "next-app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # Sur une branche, seul le dernier push compte ; une release (tag) n'est jamais annulée
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mediahub-app

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # création de la GitHub Release
      packages: write   # push sur ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ./next-app
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
