services:
  mediahub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediahub
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - mediahub_data:/app/data
    restart: always

volumes:
  mediahub_data:
