services:
  mediahub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediahub
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    restart: unless-stopped
