services:
  app:
    image: mediahub-app:latest
    container_name: mediahub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3008}:3008"
    environment:
      - DATABASE_URL=file:/data/db/prod.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3008}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - ./data/db:/data/db
    user: root

  tracker:
    image: mediahub-tracker:latest
    container_name: mediahub-tracker
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/db/prod.db
    volumes:
      - ./data/db:/data/db
    user: root
