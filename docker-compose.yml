services:
  app:
    build:
      context: ./next-app
      dockerfile: Dockerfile
      target: runner
    container_name: mediahub-app
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - DATABASE_URL=file:/data/db/dev.db
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3008
      - NEXTAUTH_SECRET=fc6d0136203923971842095817349502934851029384
      - PLAYER_INTEGRATION_API_KEY=${PLAYER_INTEGRATION_API_KEY:-}
      - PLAYER_INTEGRATION_USER_EMAIL=${PLAYER_INTEGRATION_USER_EMAIL:-}
      # - DOCKER_HOST=unix:///var/run/docker.sock
    # env_file:
    #   - ./next-app/.env
    volumes:
      - ./data/db:/data/db
      - ./tokens:/app/.config  # Persist tracker tokens/cookies between restarts
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # Uncomment if you encounter permission issues with Docker socket
    user: root
